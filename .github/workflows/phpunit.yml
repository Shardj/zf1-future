name: PHPUnit

on: [push, pull_request]

jobs:
  phpunit:
    name: Tests on PHP ${{ matrix.php-version }}${{ matrix.experimental && ' (experimental)' || '' }}

    runs-on: ubuntu-26.04

    # A failing experimental job (including PHP or extension setup) does not fail the workflow
    continue-on-error: ${{ matrix.experimental }}

    env:
      PHP_INI_VALUES: memory_limit=-1, assert.exception=1, zend.assertions=1, error_reporting=-1, log_errors_max_len=0, display_errors=On, register_argc_argv=On, browscap=${{ github.workspace }}/tests/Zend/Http/UserAgent/_files/browscap.ini

      TESTS_ZEND_DB_ADAPTER_PDO_MYSQL_ENABLED: true
      TESTS_ZEND_DB_ADAPTER_MYSQLI_ENABLED: true
      TESTS_ZEND_DB_ADAPTER_MYSQL_USERNAME: github
      TESTS_ZEND_DB_ADAPTER_MYSQL_PASSWORD: github
      TESTS_ZEND_DB_ADAPTER_MYSQL_DATABASE: zftest
      TESTS_ZEND_DB_ADAPTER_MYSQL_HOSTNAME: 127.0.0.1

      TESTS_ZEND_DB_ADAPTER_PDO_PGSQL_ENABLED: true
      TESTS_ZEND_DB_ADAPTER_PDO_PGSQL_USERNAME: github
      TESTS_ZEND_DB_ADAPTER_PDO_PGSQL_PASSWORD: github
      TESTS_ZEND_DB_ADAPTER_PDO_PGSQL_DATABASE: zftest

      TESTS_ZEND_DB_ADAPTER_PDO_SQLITE_ENABLED: true

      TESTS_ZEND_CACHE_MEMCACHED_ENABLED: true
      TESTS_ZEND_CACHE_MEMCACHED_HOST: 127.0.0.1
      TESTS_ZEND_CACHE_MEMCACHED_PORT: 11211

      TESTS_ZEND_CACHE_LIBMEMCACHED_ENABLED: true
      TESTS_ZEND_CACHE_LIBMEMCACHED_HOST: 127.0.0.1
      TESTS_ZEND_CACHE_LIBMEMCACHED_PORT: 11211

      TESTS_ZEND_CACHE_APC_ENABLED: true

      TESTS_ZEND_SERIALIZER_ADAPTER_IGBINARY_ENABLED: true

      # the files in tests/Zend/Http/Client/_files are served by PHP's built-in server (see below)
      TESTS_ZEND_HTTP_CLIENT_BASEURI: http://127.0.0.1:8085/
      TESTS_ZEND_HTTP_CLIENT_HTTPS_BASEURI: https://127.0.0.1:8443/
      TESTS_ZEND_HTTP_CLIENT_HTTP_PROXY: 127.0.0.1:8889
      TESTS_ZEND_VALIDATE_ONLINE_ENABLED: true
      TESTS_ZEND_FEED_PUBSUBHUBBUB_BASEURI: http://127.0.0.1:8085/
      # the XXE tests of Zend_Feed fetch their feeds and the entity from tests/Zend/Feed/_files
      TESTS_ZEND_FEED_IMPORT_ONLINE_BASEURI: http://127.0.0.1:8086/

      TESTS_ZEND_AUTH_ADAPTER_DBTABLE_PDO_SQLITE_ENABLED: true

      # Zend_Queue_Adapter_Activemq over STOMP on the ActiveMQ service
      TESTS_ZEND_QUEUE_ACTIVEMQ_ENABLED: true
      TESTS_ZEND_QUEUE_ACTIVEMQ_SCHEME: tcp
      TESTS_ZEND_QUEUE_ACTIVEMQ_HOST: 127.0.0.1
      TESTS_ZEND_QUEUE_ACTIVEMQ_PORT: 61613

      # https://hub.docker.com/r/bitnami/openldap
      LDAP_ROOT: "dc=example,dc=com"
      LDAP_ALLOW_ANON_BINDING: false
      LDAP_SKIP_DEFAULT_TREE: "yes"
      LDAP_ADMIN_USERNAME: "admin"
      LDAP_ADMIN_PASSWORD: "insecure"
      LDAP_CONFIG_ADMIN_USERNAME: "admin"
      LDAP_CONFIG_ADMIN_PASSWORD: "configpassword"
      TESTS_ZEND_LDAP_ONLINE_ENABLED: true
      TESTS_ZEND_AUTH_ADAPTER_LDAP_ONLINE_ENABLED: true

      LOCALES: "fr_FR@euro fr_FR fr_BE.UTF-8 de en_US"
      OPENSSL_CONF: "./tests/openssl.conf"
    services:
      activemq:
        image: apache/activemq-classic:5.18.3
        ports:
          - 61613:61613

      memcache:
        image: memcached:1.6.17-alpine
        ports:
          - 11211:11211

      mysql:
        image: bitnamilegacy/mysql:8.0.31
        env:
          MYSQL_ROOT_USER: ${{ env.TESTS_ZEND_DB_ADAPTER_MYSQL_USERNAME }}
          MYSQL_ROOT_PASSWORD: ${{ env.TESTS_ZEND_DB_ADAPTER_MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ env.TESTS_ZEND_DB_ADAPTER_MYSQL_DATABASE }}
          MYSQL_AUTHENTICATION_PLUGIN: mysql_native_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      postgres:
        image: postgres:15.1-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: ${{ env.TESTS_ZEND_DB_ADAPTER_PDO_PGSQL_USERNAME }}
          POSTGRES_PASSWORD: ${{ env.TESTS_ZEND_DB_ADAPTER_PDO_PGSQL_PASSWORD }}
          POSTGRES_DB: ${{ env.TESTS_ZEND_DB_ADAPTER_PDO_PGSQL_DATABASE }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      openldap:
        image: bitnamilegacy/openldap:2.5
        ports:
          - 1389:1389
        env:
          LDAP_ROOT: ${{ env.LDAP_ROOT }}
          LDAP_ALLOW_ANON_BINDING: ${{ env.LDAP_ALLOW_ANON_BINDING }}
          LDAP_SKIP_DEFAULT_TREE: ${{ env.LDAP_SKIP_DEFAULT_TREE }}
          LDAP_ADMIN_USERNAME: ${{ env.LDAP_ADMIN_USERNAME }}
          LDAP_ADMIN_PASSWORD: ${{ env.LDAP_ADMIN_PASSWORD }}
          LDAP_CONFIG_ADMIN_ENABLED: "yes"
          LDAP_CONFIG_ADMIN_USERNAME: ${{ env.LDAP_CONFIG_ADMIN_USERNAME }}
          LDAP_CONFIG_ADMIN_PASSWORD: ${{ env.LDAP_CONFIG_ADMIN_PASSWORD }}

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "7.4"
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        experimental:
          - false
        include:
          #bare for PHP >=7.2
          - php-extensions-bare: "none, iconv, json, libxml, xml, dom, simplexml, xmlwriter, tokenizer, mbstring"
          #full for every PHP version of the matrix
          - php-extensions-full: "none, iconv, json, libxml, xml, dom, simplexml, xmlwriter, tokenizer, mbstring, apcu, ctype, openssl, curl, gd, posix, pdo_sqlite, pdo_mysql, mysqli, fileinfo, zip, sqlite, soap, bcmath, igbinary, gmp, pdo_pgsql, bz2, lzf, memcached, memcache, ldap, intl, xdebug"
          # Experimental versions are not listed in php-version above. They are separate
          # combinations, so the generic entries above are not applied to them and both
          # extension lists have to be set here.
          # lzf does not build on PHP 8.6 yet
          - php-version: "8.6"
            php-extensions-bare: "none, iconv, json, libxml, xml, dom, simplexml, xmlwriter, tokenizer, mbstring"
            php-extensions-full: "none, iconv, json, libxml, xml, dom, simplexml, xmlwriter, tokenizer, mbstring, apcu, ctype, openssl, curl, gd, posix, pdo_sqlite, pdo_mysql, mysqli, fileinfo, zip, sqlite, soap, bcmath, igbinary, gmp, pdo_pgsql, bz2, memcached, memcache, ldap, intl"
            experimental: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Locale
        run: |
          sudo apt-get update && sudo apt-get install tzdata tzdata-legacy locales -y && sudo locale-gen $LOCALES
          echo "All languages..."
          locale -a
      
      - name: Provider config base on env for integrate test
        run: cp tests/TestConfiguration.env.php tests/TestConfiguration.php

      - name: Install PHP with minimal extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: cs2pr
          extensions: ${{ matrix.php-extensions-bare }}
          ini-values: ${{ env.PHP_INI_VALUES }}
        env:
          # https://github.com/shivammathur/setup-php/issues/407#issuecomment-773675741
          fail-fast: true

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-${{ matrix.php-version }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint PHP source files
        run: |
          bin/parallel-lint --exclude vendor --exclude tests/Zend/Loader/_files/ParseError.php . --checkstyle | cs2pr

      - name: Serve the Zend_Http_Client and Zend_Feed test files
        run: |
          php -S 127.0.0.1:8085 -t tests/Zend/Http/Client/_files > /tmp/php-server-http.log 2>&1 &
          php -S 127.0.0.1:8086 -t tests/Zend/Feed/_files > /tmp/php-server-feed.log 2>&1 &
          sleep 1
          curl -sSf http://127.0.0.1:8085/testSimpleRequests.php > /dev/null
          curl -sSf http://127.0.0.1:8086/xxe-info.txt > /dev/null

      # HTTPS in front of the Zend_Http_Client test files (self-signed certificate)
      # and an HTTP proxy for the Proxy adapter tests
      - name: Serve the Zend_Http_Client test files over HTTPS and through a proxy
        run: |
          sudo apt-get install -y socat tinyproxy
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=127.0.0.1 -keyout /tmp/zf-key.pem -out /tmp/zf-cert.pem
          cat /tmp/zf-key.pem /tmp/zf-cert.pem > /tmp/zf-server.pem
          socat openssl-listen:8443,reuseaddr,fork,cert=/tmp/zf-server.pem,verify=0 tcp:127.0.0.1:8085 > /tmp/socat.log 2>&1 &
          # the tinyproxy service reads only its own configuration file (AppArmor)
          printf 'User tinyproxy\nGroup tinyproxy\nPort 8889\nListen 127.0.0.1\nAllow 127.0.0.1\nTimeout 60\nMaxClients 50\n' | sudo tee /etc/tinyproxy/tinyproxy.conf > /dev/null
          sudo systemctl restart tinyproxy
          sleep 1
          curl -sSfk https://127.0.0.1:8443/testSimpleRequests.php > /dev/null
          curl -sSf -x http://127.0.0.1:8889 http://127.0.0.1:8085/testSimpleRequests.php > /dev/null

      - name: "Run tests on PHP ${{ matrix.php-version }} (Experimental: ${{ matrix.experimental }}) with minimal extensions"
        run: |
          bin/phpunit -c tests/phpunit.xml
        continue-on-error: ${{ matrix.experimental }}

      - name: Setup LDAP
        run: |
          sudo apt-get install -y libnss-ldap libpam-ldap ldap-utils
          tests/resources/openldap/docker-entrypoint-initdb.d/init.sh

      - name: Install PHP with extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: cs2pr
          extensions: ${{ matrix.php-extensions-full }}
          ini-values: ${{ env.PHP_INI_VALUES }}, apc.enable_cli=1
        env:
          # https://github.com/shivammathur/setup-php/issues/407#issuecomment-773675741
          fail-fast: true

      - name: Create the Zend_Queue tables
        run: |
          mysql -h 127.0.0.1 -u "$TESTS_ZEND_DB_ADAPTER_MYSQL_USERNAME" -p"$TESTS_ZEND_DB_ADAPTER_MYSQL_PASSWORD" "$TESTS_ZEND_DB_ADAPTER_MYSQL_DATABASE" < library/Zend/Queue/Adapter/Db/mysql.sql

      - name: "Run tests on PHP ${{ matrix.php-version }} (Experimental: ${{ matrix.experimental }}) with extensions"
        run: |
          bin/phpunit -c tests/phpunit.xml
        continue-on-error: ${{ matrix.experimental }}
        env:
          # Zend_Queue_Adapter_Db on the MySQL service, schema from library/Zend/Queue/Adapter/Db/mysql.sql
          TESTS_ZEND_QUEUE_DB: '{"type":"pdo_mysql","host":"127.0.0.1","port":3306,"username":"github","password":"github","dbname":"zftest"}'
