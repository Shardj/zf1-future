name: Database drivers

# only changes that can affect Zend_Db run the database servers
on:
  push:
    paths:
      - "library/Zend/Db.php"
      - "library/Zend/Db/**"
      - "tests/Zend/Db/**"
      - "tests/TestHelper.php"
      - "tests/TestConfiguration.env.php"
      - "composer.json"
      - ".github/workflows/db-drivers.yml"
  pull_request:
    paths:
      - "library/Zend/Db.php"
      - "library/Zend/Db/**"
      - "tests/Zend/Db/**"
      - "tests/TestHelper.php"
      - "tests/TestConfiguration.env.php"
      - "composer.json"
      - ".github/workflows/db-drivers.yml"

# Zend_Db tests of the drivers whose database servers are too heavy for the
# PHPUnit workflow: SQL Server, Oracle and Db2, each in its own job
jobs:
  db-drivers:
    name: Zend_Db on ${{ matrix.database }}, PHP ${{ matrix.php }}${{ matrix.experimental && ' (experimental)' || '' }}

    runs-on: ubuntu-26.04

    # A failing experimental job (including PHP or extension setup) does not fail the workflow
    continue-on-error: ${{ matrix.experimental == true }}

    strategy:
      fail-fast: false
      matrix:
        # the oldest and the newest stable PHP, and the next one
        php:
          - "7.4"
          - "8.5"
          - "8.6"
        database:
          - sqlsrv
          - oracle
          - db2
        include:
          - php: "8.6"
            experimental: true
          - database: sqlsrv
            extensions: sqlsrv, pdo_sqlsrv
          - database: oracle
            extensions: oci8, pdo_oci
          - database: db2
            extensions: ibm_db2, pdo_ibm
          # setup-php cannot build pdo_oci for PHP 8.6, the job builds it
          - php: "8.6"
            database: oracle
            extensions: oci8
            pdo_oci: build

    env:
      PHP_EXTENSIONS: "none, iconv, json, libxml, xml, dom, simplexml, xmlwriter, tokenizer, mbstring, ctype, pdo"
      PHP_INI_VALUES: memory_limit=-1, assert.exception=1, zend.assertions=1, error_reporting=-1, display_errors=On

      DB_PASSWORD: "Zend_Test_2026"

      TESTS_ZEND_DB_ADAPTER_SQLSRV_HOSTNAME: localhost
      TESTS_ZEND_DB_ADAPTER_SQLSRV_USERNAME: sa
      TESTS_ZEND_DB_ADAPTER_SQLSRV_PASSWORD: "Zend_Test_2026"
      TESTS_ZEND_DB_ADAPTER_SQLSRV_DATABASE: zftest
      TESTS_ZEND_DB_ADAPTER_PDO_MSSQL_HOSTNAME: 127.0.0.1
      TESTS_ZEND_DB_ADAPTER_PDO_MSSQL_USERNAME: sa
      TESTS_ZEND_DB_ADAPTER_PDO_MSSQL_PASSWORD: "Zend_Test_2026"
      TESTS_ZEND_DB_ADAPTER_PDO_MSSQL_DATABASE: zftest
      TESTS_ZEND_DB_ADAPTER_PDO_MSSQL_PDOTYPE: dblib

      TESTS_ZEND_DB_ADAPTER_ORACLE_HOSTNAME: 127.0.0.1
      TESTS_ZEND_DB_ADAPTER_ORACLE_USERNAME: SYSTEM
      TESTS_ZEND_DB_ADAPTER_ORACLE_PASSWORD: "Zend_Test_2026"
      TESTS_ZEND_DB_ADAPTER_ORACLE_SID: XE

      TESTS_ZEND_DB_ADAPTER_DB2_HOSTNAME: 127.0.0.1
      TESTS_ZEND_DB_ADAPTER_DB2_PORT: 50000
      TESTS_ZEND_DB_ADAPTER_DB2_USERNAME: db2inst1
      TESTS_ZEND_DB_ADAPTER_DB2_PASSWORD: "Zend_Test_2026"
      TESTS_ZEND_DB_ADAPTER_DB2_DATABASE: zftest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Provider config base on env for integrate test
        run: cp tests/TestConfiguration.env.php tests/TestConfiguration.php

      - name: Start SQL Server
        if: matrix.database == 'sqlsrv'
        run: |
          # a certificate for localhost, trusted by the runner, as the ODBC driver encrypts by default
          mkdir -p /tmp/mssql
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=localhost -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" -keyout /tmp/mssql/key.pem -out /tmp/mssql/cert.pem
          chmod 644 /tmp/mssql/key.pem /tmp/mssql/cert.pem
          sudo cp /tmp/mssql/cert.pem /usr/local/share/ca-certificates/zf-mssql.crt
          sudo update-ca-certificates
          printf '[network]\ntlscert = /var/opt/mssql/tls/cert.pem\ntlskey = /var/opt/mssql/tls/key.pem\ntlsprotocols = 1.2\nforceencryption = 0\n' > /tmp/mssql/mssql.conf
          docker run -d --name db -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$DB_PASSWORD" -p 1433:1433 -v /tmp/mssql:/var/opt/mssql/tls -v /tmp/mssql/mssql.conf:/var/opt/mssql/mssql.conf mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            docker exec db /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$DB_PASSWORD" -Q "SELECT 1" > /dev/null 2>&1 && break
            sleep 2
          done
          docker exec db /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$DB_PASSWORD" -Q "CREATE DATABASE zftest"
          echo "TESTS_ZEND_DB_ADAPTER_SQLSRV_ENABLED=true" >> $GITHUB_ENV
          echo "TESTS_ZEND_DB_ADAPTER_PDO_MSSQL_ENABLED=true" >> $GITHUB_ENV

      - name: Start Oracle
        if: matrix.database == 'oracle'
        run: |
          docker run -d --name db -e ORACLE_PASSWORD="$DB_PASSWORD" -p 1521:1521 gvenzl/oracle-xe:21-slim-faststart
          for i in $(seq 1 90); do
            docker logs db 2>&1 | grep -q "DATABASE IS READY TO USE" && break
            sleep 5
          done
          docker logs db 2>&1 | tail -5
          # the native adapter connects by the SID as a TNS name
          mkdir -p "$HOME/tns"
          echo "XE=(DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=127.0.0.1)(PORT=1521))(CONNECT_DATA=(SID=XE)))" > "$HOME/tns/tnsnames.ora"
          echo "TNS_ADMIN=$HOME/tns" >> $GITHUB_ENV
          echo "TESTS_ZEND_DB_ADAPTER_ORACLE_ENABLED=true" >> $GITHUB_ENV
          echo "TESTS_ZEND_DB_ADAPTER_PDO_OCI_ENABLED=true" >> $GITHUB_ENV

      - name: Start Db2
        if: matrix.database == 'db2'
        run: |
          docker run -d --name db --privileged -e LICENSE=accept -e DB2INSTANCE=db2inst1 -e DB2INST1_PASSWORD="$DB_PASSWORD" -e DBNAME=zftest -e ARCHIVE_LOGS=false -e AUTOCONFIG=false -p 50000:50000 icr.io/db2_community/db2:latest
          for i in $(seq 1 120); do
            docker logs db 2>&1 | grep -q "Setup has completed" && break
            sleep 5
          done
          docker logs db 2>&1 | tail -5
          echo "TESTS_ZEND_DB_ADAPTER_DB2_ENABLED=true" >> $GITHUB_ENV
          echo "TESTS_ZEND_DB_ADAPTER_PDO_IBM_ENABLED=true" >> $GITHUB_ENV

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}, ${{ matrix.extensions }}
          ini-values: ${{ env.PHP_INI_VALUES }}
          tools: ${{ (matrix.database == 'sqlsrv' || matrix.pdo_oci == 'build') && 'phpize, php-config' || '' }}
        env:
          fail-fast: true

      # sqlsrv needs the ODBC driver of Microsoft, whose repository the runner
      # has. pdo_dblib is built from the PHP sources of the installed version
      # with FreeTDS, as no package repository has it for every PHP and Ubuntu.
      - name: Install the ODBC driver and pdo_dblib
        if: matrix.database == 'sqlsrv'
        run: |
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 freetds-dev
          version=$(php -r 'echo PHP_VERSION;')
          case "$version" in
            *-dev*|*alpha*|*beta*|*RC*) ref=master ;;
            *) ref="php-$version" ;;
          esac
          mkdir -p /tmp/php-src
          curl -sSL "https://github.com/php/php-src/archive/$ref.tar.gz" | tar xz -C /tmp/php-src --strip-components=1
          cd /tmp/php-src/ext/pdo_dblib
          phpize
          ./configure --with-pdo-dblib=/usr --with-libdir=lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)
          make -j"$(nproc)"
          sudo make install
          echo "extension=pdo_dblib.so" | sudo tee "$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')/20-pdo_dblib.ini"
          php -m | grep -i dblib

      # pdo_oci of PECL with the Instant Client that setup-php installed for oci8.
      # Its sources use EMPTY_SWITCH_DEFAULT_CASE(), which PHP 8.6 does not have.
      - name: Build pdo_oci
        if: matrix.pdo_oci == 'build'
        run: |
          git clone --depth 1 https://github.com/php/pecl-database-pdo_oci.git /tmp/pdo_oci
          cd /tmp/pdo_oci
          sed -i 's/EMPTY_SWITCH_DEFAULT_CASE();/default: ZEND_UNREACHABLE();/' *.c
          phpize
          ./configure --with-pdo-oci=instantclient,/opt/oracle/instantclient
          make -j"$(nproc)"
          sudo make install
          echo "extension=pdo_oci.so" | sudo tee "$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')/20-pdo_oci.ini"
          php -m | grep -i pdo_oci

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run the Zend_Db tests
        run: |
          printf "<?php\ndefine('PHPUnit_MAIN_METHOD', 'none');\nrequire '%s/tests/TestHelper.php';\n" "$PWD" > /tmp/bootstrap.php
          bin/phpunit --verbose --bootstrap /tmp/bootstrap.php tests/Zend/Db/AllTests.php
