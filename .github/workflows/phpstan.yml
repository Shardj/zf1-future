name: PHPStan

on: [push, pull_request]

jobs:
  phpstan:
    name: Analyze
    runs-on: ubuntu-26.04

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 7.4

      - uses: actions/checkout@v5

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --ignore-platform-req=ext-*

      - name: Restore result cache
        uses: actions/cache/restore@v5
        with:
          path: .phpstan.cache
          key: phpstan-result-cache-${{ github.run_id }}
          restore-keys: |
            phpstan-result-cache-

      - name: PHPStan Static Analysis
        run: XDEBUG_MODE=off php bin/phpstan.phar analyze --configuration .phpstan.dist.neon

      - name: Save result cache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: .phpstan.cache
          key: phpstan-result-cache-${{ github.run_id }}
  phpstan-php86:
    name: Analyze for PHP 8.6 (experimental)
    runs-on: ubuntu-26.04

    # Runs the latest PHPStan release, which knows PHP 8.6; a failing job does not fail the workflow
    continue-on-error: true

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 7.4

      - uses: actions/checkout@v5

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --ignore-platform-req=ext-*

      - name: Update PHPStan to the latest release
        run: composer update phpstan/phpstan phpstan/phpstan-phpunit --prefer-dist --no-progress --ignore-platform-req=ext-*

      - name: PHPStan Static Analysis
        run: XDEBUG_MODE=off php bin/phpstan.phar analyze --configuration .phpstan.php86.neon
