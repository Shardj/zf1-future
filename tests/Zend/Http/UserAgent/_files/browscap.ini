;;; Minimal browscap.ini for the tests, with the two mobile browsers they use

[GJK_Browscap_Version]
Version=1
Released=Thu, 05 Nov 2026 00:00:00 +0000

[DefaultProperties]
Comment="DefaultProperties"
Browser="DefaultProperties"
Version="0.0"
Platform="unknown"
isMobileDevice="false"
JavaScript="false"
CssVersion="0"

[Mozilla/5.0 (iPhone; U; CPU like Mac OS X; *) AppleWebKit/* (KHTML, like Gecko) Version/3.0 Mobile/* Safari/*]
Parent="DefaultProperties"
Browser="iPhone"
Version="3.0"
Platform="iPhone OSX"
isMobileDevice="true"
JavaScript="true"
CssVersion="3"

[*SEMC-Browser/*]
Parent="DefaultProperties"
Browser="SEMC Browser"
Platform="JAVA"
isMobileDevice="true"
JavaScript="true"
CssVersion="1"
